name: Compilar mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Descomprimir el codigo del mod
        run: |
          for f in *.zip; do unzip -o "$f"; done
          ls -R src | head -50

      - name: Instalar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Compilar
        run: gradle build --no-daemon

      - name: Guardar el .jar
        uses: actions/upload-artifact@v4
        with:
          name: kitty-pryde-mod-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
